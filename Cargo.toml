[package]
name = "dht11-trace"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "DHT11 driver for embedded-hal 1.0 that reports the protocol stage where a read failed"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marcelobns/dht11-trace"
readme = "README.md"
keywords = ["dht11", "embedded-hal", "sensor", "humidity", "temperature"]
categories = ["embedded", "hardware-support", "no-std"]
# Repository conventions, not part of the crate.
exclude = ["AGENTS.md"]

[dependencies]
embedded-hal = "1.0"
