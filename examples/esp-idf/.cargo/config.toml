[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
# Pins the ESP-IDF version (the esp-idf-sys 0.38 default) for reproducible builds.
ESP_IDF_VERSION = "v5.5.5"
# Installs ESP-IDF in ~/.espressif, outside the repository and shared between projects.
ESP_IDF_TOOLS_INSTALL_DIR = "global"
